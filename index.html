<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Комната подростка — изометрия</title>
<style>
  html, body { margin: 0; padding: 0; overflow: hidden; background: #1a1a24; font-family: system-ui, sans-serif; }
  #ui {
    position: fixed; top: 12px; left: 12px; z-index: 10;
    background: rgba(20,20,30,0.85); color: #eee; padding: 12px 14px;
    border-radius: 10px; backdrop-filter: blur(6px);
    box-shadow: 0 4px 20px rgba(0,0,0,0.4);
  }
  #ui h3 { margin: 0 0 8px 0; font-size: 14px; color: #8fd; }
  #ui label { display: block; margin: 4px 0; cursor: pointer; font-size: 13px; }
  #ui input { margin-right: 6px; }
  #hint {
    position: fixed; bottom: 12px; left: 12px; z-index: 10;
    background: rgba(20,20,30,0.75); color: #ccc; padding: 8px 12px;
    border-radius: 8px; font-size: 12px;
  }
</style>
</head>
<body>

<div id="ui">
  <h3>🏠 Вид комнаты</h3>
  <label><input type="radio" name="view" value="all" checked> Все 4 стены</label>
  <label><input type="radio" name="view" value="back"> Только задняя стена</label>
  <label><input type="radio" name="view" value="floor"> Только пол</label>
</div>
<div id="hint">ЛКМ — вращать · ПКМ / Shift+ЛКМ — двигать · Колёсико — зум</div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// ---------- Сцена, камера, рендерер ----------
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x1a1a24);
scene.fog = new THREE.Fog(0x1a1a24, 30, 60);

const aspect = window.innerWidth / window.innerHeight;
const frustum = 10;
const camera = new THREE.OrthographicCamera(
  -frustum * aspect, frustum * aspect, frustum, -frustum, 0.1, 200
);
// Изометрический ракурс
camera.position.set(14, 14, 14);
camera.lookAt(0, 0, 0);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(window.devicePixelRatio);
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

// ---------- Управление ----------
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.minZoom = 0.4;
controls.maxZoom = 3;
controls.maxPolarAngle = Math.PI / 2.1;
controls.target.set(0, 1.5, 0);
controls.update();

// ---------- Свет ----------
const ambient = new THREE.AmbientLight(0xffffff, 0.35);
scene.add(ambient);

const hemi = new THREE.HemisphereLight(0x88aaff, 0x443322, 0.4);
scene.add(hemi);

const sun = new THREE.DirectionalLight(0xfff1cc, 1.1);
sun.position.set(8, 14, 6);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.left = -12;
sun.shadow.camera.right = 12;
sun.shadow.camera.top = 12;
sun.shadow.camera.bottom = -12;
sun.shadow.camera.near = 0.5;
sun.shadow.camera.far = 40;
sun.shadow.bias = -0.0005;
scene.add(sun);

// Тёплая лампа в комнате
const lampLight = new THREE.PointLight(0xffaa55, 1.2, 12, 2);
lampLight.position.set(-3.5, 4.2, -3.5);
lampLight.castShadow = true;
scene.add(lampLight);

// ---------- Материалы ----------
const mat = {
  floor: new THREE.MeshStandardMaterial({ color: 0xc9a57b, roughness: 0.85 }),
  wall: new THREE.MeshStandardMaterial({ color: 0xe9d9c4, roughness: 0.9 }),
  wallAccent: new THREE.MeshStandardMaterial({ color: 0x6b8cae, roughness: 0.8 }),
  wood: new THREE.MeshStandardMaterial({ color: 0x8b5a2b, roughness: 0.7 }),
  woodDark: new THREE.MeshStandardMaterial({ color: 0x5a3a1e, roughness: 0.7 }),
  woodLight: new THREE.MeshStandardMaterial({ color: 0xd2a679, roughness: 0.7 }),
  bedFrame: new THREE.MeshStandardMaterial({ color: 0x3a3a44, roughness: 0.6 }),
  mattress: new THREE.MeshStandardMaterial({ color: 0xf2e9d8, roughness: 0.9 }),
  blanket: new THREE.MeshStandardMaterial({ color: 0x4a6fa5, roughness: 0.95 }),
  pillow: new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.95 }),
  plastic: new THREE.MeshStandardMaterial({ color: 0x2a2a30, roughness: 0.4 }),
  screen: new THREE.MeshStandardMaterial({ color: 0x223355, emissive: 0x3366aa, emissiveIntensity: 0.8 }),
  red: new THREE.MeshStandardMaterial({ color: 0xc0392b, roughness: 0.6 }),
  green: new THREE.MeshStandardMaterial({ color: 0x4a8f3a, roughness: 0.9 }),
  darkGreen: new THREE.MeshStandardMaterial({ color: 0x2d5a27, roughness: 0.9 }),
  pot: new THREE.MeshStandardMaterial({ color: 0x8a4a2a, roughness: 0.8 }),
  carpet: new THREE.MeshStandardMaterial({ color: 0x9b3a5a, roughness: 1.0 }),
  metal: new THREE.MeshStandardMaterial({ color: 0xaaaaaa, metalness: 0.8, roughness: 0.3 }),
  poster1: new THREE.MeshStandardMaterial({ color: 0xe74c3c }),
  poster2: new THREE.MeshStandardMaterial({ color: 0xf1c40f }),
  poster3: new THREE.MeshStandardMaterial({ color: 0x9b59b6 }),
  hoodie: new THREE.MeshStandardMaterial({ color: 0x2c3e50, roughness: 0.95 }),
  jeans: new THREE.MeshStandardMaterial({ color: 0x34495e, roughness: 0.95 }),
  shoe: new THREE.MeshStandardMaterial({ color: 0xecf0f1, roughness: 0.6 }),
  trash: new THREE.MeshStandardMaterial({ color: 0x555555, roughness: 0.7 }),
  guitar: new THREE.MeshStandardMaterial({ color: 0xb03a2e, roughness: 0.5 }),
  skateboard: new THREE.MeshStandardMaterial({ color: 0x16a085, roughness: 0.6 }),
  rug: new THREE.MeshStandardMaterial({ color: 0x3d5a80, roughness: 1.0 }),
};

// ---------- Комната ----------
const roomGroup = new THREE.Group();
scene.add(roomGroup);

const floorGroup = new THREE.Group();
const wallBack = new THREE.Group();
const wallLeft = new THREE.Group();
const wallRight = new THREE.Group();
const wallFront = new THREE.Group();

const ROOM = 10;
const WALL_H = 6;
const WALL_T = 0.2;

// Пол — деревянный
const floor = new THREE.Mesh(
  new THREE.BoxGeometry(ROOM, 0.2, ROOM),
  mat.floor
);
floor.position.y = -0.1;
floor.receiveShadow = true;
floorGroup.add(floor);

// Полоски на полу (имитация досок)
for (let i = -4; i <= 4; i++) {
  const stripe = new THREE.Mesh(
    new THREE.BoxGeometry(ROOM, 0.02, 0.03),
    new THREE.MeshStandardMaterial({ color: 0x6b4423, roughness: 0.9 })
  );
  stripe.position.set(0, 0.01, i * 1.1);
  floorGroup.add(stripe);
}

// Функция создания стены
function makeWall(w, h, d, material) {
  const wall = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), material);
  wall.castShadow = true;
  wall.receiveShadow = true;
  return wall;
}

// Задняя стена (с акцентным цветом)
const backWall = makeWall(ROOM, WALL_H, WALL_T, mat.wallAccent);
backWall.position.set(0, WALL_H / 2, -ROOM / 2);
wallBack.add(backWall);

// Окно на задней стене
const windowFrame = new THREE.Mesh(
  new THREE.BoxGeometry(2.2, 2.2, 0.1),
  mat.woodLight
);
windowFrame.position.set(2, 3.5, -ROOM / 2 + 0.15);
wallBack.add(windowFrame);
const windowGlass = new THREE.Mesh(
  new THREE.BoxGeometry(1.9, 1.9, 0.05),
  new THREE.MeshStandardMaterial({ color: 0xaaddff, emissive: 0x88bbee, emissiveIntensity: 0.5, transparent: true, opacity: 0.6 })
);
windowGlass.position.set(2, 3.5, -ROOM / 2 + 0.2);
wallBack.add(windowGlass);
// Крестовина окна
const crossH = new THREE.Mesh(new THREE.BoxGeometry(1.9, 0.08, 0.08), mat.woodLight);
crossH.position.set(2, 3.5, -ROOM / 2 + 0.22);
wallBack.add(crossH);
const crossV = new THREE.Mesh(new THREE.BoxGeometry(0.08, 1.9, 0.08), mat.woodLight);
crossV.position.set(2, 3.5, -ROOM / 2 + 0.22);
wallBack.add(crossV);

// Левая стена
const leftWall = makeWall(WALL_T, WALL_H, ROOM, mat.wall);
leftWall.position.set(-ROOM / 2, WALL_H / 2, 0);
wallLeft.add(leftWall);

// Правая стена
const rightWall = makeWall(WALL_T, WALL_H, ROOM, mat.wall);
rightWall.position.set(ROOM / 2, WALL_H / 2, 0);
wallRight.add(rightWall);

// Передняя стена (полупрозрачная/низкая — чтобы было видно)
const frontWall = makeWall(ROOM, WALL_H, WALL_T, mat.wall);
frontWall.position.set(0, WALL_H / 2, ROOM / 2);
frontWall.material = mat.wall.clone();
frontWall.material.transparent = true;
frontWall.material.opacity = 0.25;
wallFront.add(frontWall);

roomGroup.add(floorGroup, wallBack, wallLeft, wallRight, wallFront);

// ---------- Постеры на задней стене ----------
function makePoster(material, x, y, z, w = 1.2, h = 1.6) {
  const p = new THREE.Mesh(new THREE.BoxGeometry(w, h, 0.05), material);
  p.position.set(x, y, z);
  p.castShadow = true;
  return p;
}
wallBack.add(makePoster(mat.poster1, -3.2, 3.8, -ROOM / 2 + 0.15));
wallBack.add(makePoster(mat.poster2, -1.5, 4.2, -ROOM / 2 + 0.15, 1.0, 1.4));
wallBack.add(makePoster(mat.poster3, -2.3, 2.2, -ROOM / 2 + 0.15, 0.9, 1.2));

// ---------- Большой реперский постер на левой стене ----------
const rapPoster = new THREE.Mesh(
  new THREE.BoxGeometry(0.05, 3.2, 2.2),
  new THREE.MeshStandardMaterial({ color: 0x111111, roughness: 0.9 })
);
rapPoster.position.set(-ROOM / 2 + 0.15, 3.6, -0.5);
rapPoster.castShadow = true;
wallLeft.add(rapPoster);
// Граффити/золотой элемент на постере
const rapDetail1 = new THREE.Mesh(
  new THREE.BoxGeometry(0.06, 1.2, 1.6),
  new THREE.MeshStandardMaterial({ color: 0xd4af37, roughness: 0.4, metalness: 0.3 })
);
rapDetail1.position.set(-ROOM / 2 + 0.18, 4.0, -0.5);
wallLeft.add(rapDetail1);
const rapDetail2 = new THREE.Mesh(
  new THREE.BoxGeometry(0.06, 0.8, 1.0),
  new THREE.MeshStandardMaterial({ color: 0xc0392b, roughness: 0.5 })
);
rapDetail2.position.set(-ROOM / 2 + 0.18, 3.0, -0.5);
wallLeft.add(rapDetail2);

// ---------- Ковёр ----------
const carpet = new THREE.Mesh(
  new THREE.BoxGeometry(5, 0.05, 4),
  mat.carpet
);
carpet.position.set(0, 0.03, 0.5);
carpet.receiveShadow = true;
floorGroup.add(carpet);
// Узор на ковре
const carpetPattern = new THREE.Mesh(
  new THREE.BoxGeometry(4.2, 0.02, 3.2),
  mat.rug
);
carpetPattern.position.set(0, 0.06, 0.5);
floorGroup.add(carpetPattern);

// ---------- КРОВАТЬ ----------
const bed = new THREE.Group();
const bedFrameMesh = new THREE.Mesh(new THREE.BoxGeometry(3, 0.6, 4.5), mat.bedFrame);
bedFrameMesh.position.y = 0.3;
bedFrameMesh.castShadow = true;
bed.add(bedFrameMesh);
const mattress = new THREE.Mesh(new THREE.BoxGeometry(2.8, 0.4, 4.3), mat.mattress);
mattress.position.y = 0.8;
mattress.castShadow = true;
bed.add(mattress);
const blanket = new THREE.Mesh(new THREE.BoxGeometry(2.8, 0.2, 3), mat.blanket);
blanket.position.set(0, 1.1, 0.5);
blanket.castShadow = true;
bed.add(blanket);
const pillow = new THREE.Mesh(new THREE.BoxGeometry(1.2, 0.3, 0.8), mat.pillow);
pillow.position.set(0, 1.15, -1.6);
pillow.castShadow = true;
bed.add(pillow);
// Изголовье
const headboard = new THREE.Mesh(new THREE.BoxGeometry(3, 1.5, 0.2), mat.bedFrame);
headboard.position.set(0, 1.35, -2.25);
headboard.castShadow = true;
bed.add(headboard);
bed.position.set(-3.2, 0, -2.5);
scene.add(bed);

// ---------- СТОЛ С КОМПЬЮТЕРОМ ----------
const desk = new THREE.Group();
const deskTop = new THREE.Mesh(new THREE.BoxGeometry(3.2, 0.15, 1.4), mat.woodLight);
deskTop.position.y = 1.6;
deskTop.castShadow = true;
deskTop.receiveShadow = true;
desk.add(deskTop);
// Ножки
for (const [x, z] of [[-1.5, -0.6], [1.5, -0.6], [-1.5, 0.6], [1.5, 0.6]]) {
  const leg = new THREE.Mesh(new THREE.BoxGeometry(0.12, 1.6, 0.12), mat.woodLight);
  leg.position.set(x, 0.8, z);
  leg.castShadow = true;
  desk.add(leg);
}

// Основной монитор
const monitorStand = new THREE.Mesh(new THREE.BoxGeometry(0.4, 0.1, 0.4), mat.plastic);
monitorStand.position.set(0, 1.73, -0.3);
desk.add(monitorStand);
const monitorNeck = new THREE.Mesh(new THREE.BoxGeometry(0.15, 0.4, 0.15), mat.plastic);
monitorNeck.position.set(0, 1.98, -0.3);
desk.add(monitorNeck);
const monitor = new THREE.Mesh(new THREE.BoxGeometry(2.2, 1.3, 0.1), mat.plastic);
monitor.position.set(0, 2.85, -0.35);
monitor.castShadow = true;
desk.add(monitor);
const screen = new THREE.Mesh(new THREE.BoxGeometry(2.0, 1.1, 0.02), mat.screen);
screen.position.set(0, 2.85, -0.28);
desk.add(screen);

// ВТОРОЙ МОНИТОР (слева)
const monitor2Stand = new THREE.Mesh(new THREE.BoxGeometry(0.3, 0.1, 0.3), mat.plastic);
monitor2Stand.position.set(-1.1, 1.73, -0.3);
desk.add(monitor2Stand);
const monitor2Neck = new THREE.Mesh(new THREE.BoxGeometry(0.1, 0.4, 0.1), mat.plastic);
monitor2Neck.position.set(-1.1, 1.98, -0.3);
desk.add(monitor2Neck);
const monitor2 = new THREE.Mesh(new THREE.BoxGeometry(1.8, 1.1, 0.1), mat.plastic);
monitor2.position.set(-1.1, 2.85, -0.35);
monitor2.rotation.y = 0.35;
monitor2.castShadow = true;
desk.add(monitor2);
const screen2 = new THREE.Mesh(new THREE.BoxGeometry(1.6, 0.9, 0.02), mat.screen);
screen2.position.set(-1.1, 2.85, -0.28);
screen2.rotation.y = 0.35;
desk.add(screen2);

// Микрофон на столе
const micBase = new THREE.Mesh(new THREE.CylinderGeometry(0.15, 0.15, 0.05, 16), mat.metal);
micBase.position.set(0.8, 1.73, 0.4);
desk.add(micBase);
const micArm = new THREE.Mesh(new THREE.CylinderGeometry(0.03, 0.03, 0.6, 8), mat.metal);
micArm.position.set(0.8, 2.05, 0.4);
desk.add(micArm);
const micHead = new THREE.Mesh(new THREE.CylinderGeometry(0.06, 0.06, 0.25, 16), mat.plastic);
micHead.position.set(0.8, 2.4, 0.4);
desk.add(micHead);
const micMesh = new THREE.Mesh(new THREE.SphereGeometry(0.08, 16, 16), mat.metal);
micMesh.position.set(0.8, 2.55, 0.4);
desk.add(micMesh);

// Наушники (лежат на столе)
const hpBand = new THREE.Mesh(new THREE.TorusGeometry(0.15, 0.03, 8, 16, Math.PI), mat.plastic);
hpBand.position.set(-0.6, 1.76, 0.5);
hpBand.rotation.y = Math.PI / 2;
desk.add(hpBand);
const hpLeft = new THREE.Mesh(new THREE.BoxGeometry(0.08, 0.12, 0.08), mat.plastic);
hpLeft.position.set(-0.6, 1.72, 0.35);
desk.add(hpLeft);
const hpRight = new THREE.Mesh(new THREE.BoxGeometry(0.08, 0.12, 0.08), mat.plastic);
hpRight.position.set(-0.6, 1.72, 0.65);
desk.add(hpRight);

// Клавиатура
const keyboard = new THREE.Mesh(new THREE.BoxGeometry(1.2, 0.05, 0.4), mat.plastic);
keyboard.position.set(-0.2, 1.7, 0.2);
desk.add(keyboard);
// Мышь
const mouse = new THREE.Mesh(new THREE.BoxGeometry(0.2, 0.08, 0.35), mat.plastic);
mouse.position.set(1.0, 1.7, 0.2);
desk.add(mouse);

// Ноутбук сбоку
const laptopBase = new THREE.Mesh(new THREE.BoxGeometry(0.9, 0.05, 0.6), mat.plastic);
laptopBase.position.set(-1.2, 1.7, 0.1);
desk.add(laptopBase);
const laptopScreen = new THREE.Mesh(new THREE.BoxGeometry(0.9, 0.6, 0.04), mat.plastic);
laptopScreen.position.set(-1.2, 2.0, -0.15);
laptopScreen.rotation.x = -0.2;
desk.add(laptopScreen);
const laptopDisplay = new THREE.Mesh(new THREE.BoxGeometry(0.8, 0.5, 0.02), mat.screen);
laptopDisplay.position.set(-1.2, 2.0, -0.13);
laptopDisplay.rotation.x = -0.2;
desk.add(laptopDisplay);

// Игровая приставка на столе
const console_ = new THREE.Mesh(new THREE.BoxGeometry(0.7, 0.15, 0.5), mat.plastic);
console_.position.set(1.2, 1.75, -0.3);
desk.add(console_);
const consoleLed = new THREE.Mesh(
  new THREE.BoxGeometry(0.05, 0.03, 0.03),
  new THREE.MeshStandardMaterial({ color: 0x00ff88, emissive: 0x00ff88, emissiveIntensity: 1.5 })
);
consoleLed.position.set(1.4, 1.78, -0.1);
desk.add(consoleLed);

// Кружка
const mug = new THREE.Mesh(new THREE.CylinderGeometry(0.15, 0.15, 0.3, 16), mat.red);
mug.position.set(1.3, 1.82, 0.3);
mug.castShadow = true;
desk.add(mug);

desk.position.set(3.3, 0, -3.8);
scene.add(desk);

// ---------- СТУЛ ----------
const chair = new THREE.Group();
const chairSeat = new THREE.Mesh(new THREE.BoxGeometry(1.1, 0.15, 1.1), mat.plastic);
chairSeat.position.y = 1.0;
chair.add(chairSeat);
const chairBack = new THREE.Mesh(new THREE.BoxGeometry(1.1, 1.2, 0.12), mat.plastic);
chairBack.position.set(0, 1.7, -0.5);
chair.add(chairBack);
const chairPole = new THREE.Mesh(new THREE.CylinderGeometry(0.08, 0.08, 0.9, 12), mat.metal);
chairPole.position.y = 0.5;
chair.add(chairPole);
const chairBase = new THREE.Mesh(new THREE.CylinderGeometry(0.6, 0.6, 0.1, 16), mat.plastic);
chairBase.position.y = 0.1;
chair.add(chairBase);
// Колёсики
for (let i = 0; i < 5; i++) {
  const a = (i / 5) * Math.PI * 2;
  const wheel = new THREE.Mesh(new THREE.SphereGeometry(0.1, 8, 8), mat.plastic);
  wheel.position.set(Math.cos(a) * 0.5, 0.05, Math.sin(a) * 0.5);
  chair.add(wheel);
}
chair.position.set(3.3, 0, -2.2);
scene.add(chair);

// ---------- БОЛЬШОЙ ТЕЛЕВИЗОР С ПРИСТАВКОЙ ----------
const tvGroup = new THREE.Group();
// Тумба под ТВ
const tvStand = new THREE.Mesh(new THREE.BoxGeometry(0.4, 1.0, 2.4), mat.woodDark);
tvStand.position.set(4.8, 0.5, 0);
tvStand.castShadow = true;
tvGroup.add(tvStand);
// Корпус телевизора
const tvFrame = new THREE.Mesh(new THREE.BoxGeometry(0.2, 2.2, 3.4), mat.plastic);
tvFrame.position.set(4.9, 3.2, 0);
tvFrame.castShadow = true;
tvGroup.add(tvFrame);
// Экран телевизора
const tvScreen = new THREE.Mesh(
  new THREE.BoxGeometry(0.25, 2.0, 3.2), 
  new THREE.MeshStandardMaterial({ color: 0x111111, emissive: 0x224466, emissiveIntensity: 0.5 })
);
tvScreen.position.set(4.85, 3.2, 0);
tvGroup.add(tvScreen);
// Игровая приставка под ТВ
const gameConsoleTV = new THREE.Mesh(new THREE.BoxGeometry(0.8, 0.15, 0.6), mat.plastic);
gameConsoleTV.position.set(4.5, 1.05, 0);
gameConsoleTV.castShadow = true;
tvGroup.add(gameConsoleTV);
const consoleLedTV = new THREE.Mesh(
  new THREE.BoxGeometry(0.05, 0.03, 0.03),
  new THREE.MeshStandardMaterial({ color: 0x00ff88, emissive: 0x00ff88, emissiveIntensity: 1.5 })
);
consoleLedTV.position.set(4.1, 1.08, 0);
tvGroup.add(consoleLedTV);

tvGroup.position.set(0, 0, 1.5); // Сдвигаем ближе к переднему правому углу
scene.add(tvGroup);

// ---------- ЛЮСТРА ----------
const chandelier = new THREE.Group();
const chMount = new THREE.Mesh(new THREE.CylinderGeometry(0.25, 0.25, 0.1, 16), mat.metal);
chMount.position.y = 5.95;
chandelier.add(chMount);

const chRod = new THREE.Mesh(new THREE.CylinderGeometry(0.06, 0.06, 1.2, 8), mat.metal);
chRod.position.y = 5.3;
chandelier.add(chRod);

// Основание люстры
const chBase = new THREE.Mesh(new THREE.CylinderGeometry(0.6, 0.6, 0.15, 16), mat.metal);
chBase.position.y = 4.7;
chandelier.add(chBase);

// Плафоны/лампочки
for (let i = 0; i < 4; i++) {
  const angle = (i / 4) * Math.PI * 2;
  const arm = new THREE.Mesh(new THREE.BoxGeometry(0.6, 0.04, 0.04), mat.metal);
  arm.position.set(Math.cos(angle) * 0.3, 4.7, Math.sin(angle) * 0.3);
  arm.rotation.y = -angle;
  chandelier.add(arm);
  
  const bulb = new THREE.Mesh(
    new THREE.SphereGeometry(0.15, 16, 16), 
    new THREE.MeshStandardMaterial({ color: 0xffffee, emissive: 0xffffee, emissiveIntensity: 1.2 })
  );
  bulb.position.set(Math.cos(angle) * 0.6, 4.6, Math.sin(angle) * 0.6);
  chandelier.add(bulb);
}

// Центральный свет от люстры
const chLight = new THREE.PointLight(0xffffee, 0.6, 10);
chLight.position.y = 4.5;
chandelier.add(chLight);

chandelier.position.set(0, 0, 0);
scene.add(chandelier);

// ---------- КНИЖНЫЙ ШКАФ ----------
const bookcase = new THREE.Group();
const bcBack = new THREE.Mesh(new THREE.BoxGeometry(2, 4.5, 0.1), mat.woodDark);
bcBack.position.set(0, 2.25, -0.4);
bookcase.add(bcBack);
const bcLeft = new THREE.Mesh(new THREE.BoxGeometry(0.1, 4.5, 0.9), mat.woodDark);
bcLeft.position.set(-1, 2.25, 0);
bookcase.add(bcLeft);
const bcRight = new THREE.Mesh(new THREE.BoxGeometry(0.1, 4.5, 0.9), mat.woodDark);
bcRight.position.set(1, 2.25, 0);
bookcase.add(bcRight);
for (let i = 0; i < 5; i++) {
  const shelf = new THREE.Mesh(new THREE.BoxGeometry(2, 0.08, 0.9), mat.woodDark);
  shelf.position.set(0, i * 1.1 + 0.1, 0);
  shelf.receiveShadow = true;
  bookcase.add(shelf);
}
// Книги
const bookColors = [0xe74c3c, 0x3498db, 0x2ecc71, 0xf39c12, 0x9b59b6, 0x1abc9c, 0xe67e22, 0x34495e];
for (let row = 0; row < 4; row++) {
  const y = row * 1.1 + 0.55;
  let x = -0.85;
  const count = 5 + Math.floor(Math.random() * 3);
  for (let i = 0; i < count; i++) {
    const w = 0.1 + Math.random() * 0.08;
    const h = 0.7 + Math.random() * 0.3;
    const color = bookColors[Math.floor(Math.random() * bookColors.length)];
    const book = new THREE.Mesh(
      new THREE.BoxGeometry(w, h, 0.6),
      new THREE.MeshStandardMaterial({ color, roughness: 0.8 })
    );
    book.position.set(x + w / 2, y, 0);
    book.castShadow = true;
    bookcase.add(book);
    x += w + 0.02;
    if (x > 0.85) break;
  }
}
bookcase.position.set(-4.5, 0, 2);
scene.add(bookcase);

// ---------- НАСТОЛЬНАЯ ЛАМПА ----------
const lamp = new THREE.Group();
const lampBase = new THREE.Mesh(new THREE.CylinderGeometry(0.3, 0.35, 0.15, 16), mat.metal);
lampBase.position.y = 0.075;
lamp.add(lampBase);
const lampArm1 = new THREE.Mesh(new THREE.CylinderGeometry(0.04, 0.04, 1.5, 8), mat.metal);
lampArm1.position.set(0, 0.85, 0);
lamp.add(lampArm1);
const lampArm2 = new THREE.Mesh(new THREE.CylinderGeometry(0.04, 0.04, 1.2, 8), mat.metal);
lampArm2.position.set(0.3, 1.9, 0);
lampArm2.rotation.z = -0.6;
lamp.add(lampArm2);
const lampShade = new THREE.Mesh(new THREE.ConeGeometry(0.4, 0.5, 16, 1, true), mat.red);
lampShade.position.set(0.6, 2.3, 0);
lampShade.rotation.z = Math.PI;
lamp.add(lampShade);
lamp.position.set(-3.5, 3.5, -3.5);
scene.add(lamp);

// ---------- РАСТЕНИЕ ----------
const plant = new THREE.Group();
const pot = new THREE.Mesh(new THREE.CylinderGeometry(0.35, 0.25, 0.5, 16), mat.pot);
pot.position.y = 0.25;
pot.castShadow = true;
plant.add(pot);
const soil = new THREE.Mesh(new THREE.CylinderGeometry(0.33, 0.33, 0.05, 16), mat.woodDark);
soil.position.y = 0.5;
plant.add(soil);
// Листья
for (let i = 0; i < 8; i++) {
  const leaf = new THREE.Mesh(
    new THREE.SphereGeometry(0.25, 8, 8),
    i % 2 ? mat.green : mat.darkGreen
  );
  const a = (i / 8) * Math.PI * 2;
  const r = 0.2 + Math.random() * 0.15;
  leaf.position.set(Math.cos(a) * r, 0.8 + Math.random() * 0.4, Math.sin(a) * r);
  leaf.scale.set(1, 0.7, 1);
  leaf.castShadow = true;
  plant.add(leaf);
}
plant.position.set(4.3, 0, 3.8);
scene.add(plant);

// ---------- ГИТАРА ----------
const guitar = new THREE.Group();
const gBody = new THREE.Mesh(new THREE.SphereGeometry(0.5, 16, 16), mat.guitar);
gBody.scale.set(1, 0.3, 1.4);
gBody.castShadow = true;
guitar.add(gBody);
const gNeck = new THREE.Mesh(new THREE.BoxGeometry(0.18, 0.1, 1.4), mat.woodDark);
gNeck.position.set(0, 0.05, -1.1);
guitar.add(gNeck);
const gHead = new THREE.Mesh(new THREE.BoxGeometry(0.25, 0.1, 0.3), mat.woodDark);
gHead.position.set(0, 0.05, -1.85);
guitar.add(gHead);
guitar.position.set(3.5, 0.3, 3.5);
guitar.rotation.y = -0.5;
scene.add(guitar);

// ---------- СКЕЙТБОРД ----------
const skateboard = new THREE.Group();
const sbDeck = new THREE.Mesh(new THREE.BoxGeometry(0.6, 0.08, 2), mat.skateboard);
sbDeck.castShadow = true;
skateboard.add(sbDeck);
for (const z of [-0.7, 0.7]) {
  const truck = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.08, 0.15), mat.metal);
  truck.position.set(0, -0.08, z);
  skateboard.add(truck);
  for (const x of [-0.22, 0.22]) {
    const wheel = new THREE.Mesh(new THREE.CylinderGeometry(0.1, 0.1, 0.08, 12), mat.shoe);
    wheel.rotation.z = Math.PI / 2;
    wheel.position.set(x, -0.15, z);
    skateboard.add(wheel);
  }
}
skateboard.position.set(-1, 0.2, 4.2);
skateboard.rotation.y = 0.3;
scene.add(skateboard);

// ---------- РАЗБРОСАННАЯ ОДЕЖДА ----------
const hoodie = new THREE.Mesh(new THREE.BoxGeometry(0.9, 0.2, 1.2), mat.hoodie);
hoodie.position.set(1.5, 0.1, 2.5);
hoodie.rotation.y = 0.4;
hoodie.castShadow = true;
scene.add(hoodie);

const jeans = new THREE.Mesh(new THREE.BoxGeometry(0.7, 0.15, 1.0), mat.jeans);
jeans.position.set(-0.5, 0.08, 3.2);
jeans.rotation.y = -0.6;
jeans.castShadow = true;
scene.add(jeans);

const shoe1 = new THREE.Mesh(new THREE.BoxGeometry(0.3, 0.2, 0.6), mat.shoe);
shoe1.position.set(2.5, 0.1, 1.5);
shoe1.rotation.y = 0.8;
scene.add(shoe1);
const shoe2 = new THREE.Mesh(new THREE.BoxGeometry(0.3, 0.2, 0.6), mat.shoe);
shoe2.position.set(2.9, 0.1, 1.7);
shoe2.rotation.y = 1.2;
scene.add(shoe2);

// ---------- МУСОРНОЕ ВЕДРО ----------
const trashBin = new THREE.Mesh(
  new THREE.CylinderGeometry(0.35, 0.28, 0.7, 16, 1, true),
  mat.trash
);
trashBin.position.set(4.2, 0.35, -2);
trashBin.castShadow = true;
scene.add(trashBin);
// Мусор внутри
for (let i = 0; i < 3; i++) {
  const trash = new THREE.Mesh(
    new THREE.SphereGeometry(0.1, 6, 6),
    new THREE.MeshStandardMaterial({ color: 0xaaaaaa, roughness: 1 })
  );
  trash.position.set(4.2 + (Math.random() - 0.5) * 0.3, 0.7 + i * 0.05, -2 + (Math.random() - 0.5) * 0.3);
  scene.add(trash);
}

// ---------- ТУМБОЧКА У КРОВАТИ ----------
const nightstand = new THREE.Group();
const nsBody = new THREE.Mesh(new THREE.BoxGeometry(0.9, 1.0, 0.8), mat.woodLight);
nsBody.position.y = 0.5;
nsBody.castShadow = true;
nightstand.add(nsBody);
// Ящик
const nsDrawer = new THREE.Mesh(new THREE.BoxGeometry(0.8, 0.35, 0.05), mat.wood);
nsDrawer.position.set(0, 0.5, 0.41);
nightstand.add(nsDrawer);
const nsHandle = new THREE.Mesh(new THREE.BoxGeometry(0.25, 0.05, 0.05), mat.metal);
nsHandle.position.set(0, 0.5, 0.45);

nightstand.position.set(-1.3, 0, -3.8);

// Будильник на тумбочке
const alarm = new THREE.Mesh(new THREE.BoxGeometry(0.35, 0.35, 0.15), mat.red);
alarm.position.set(-1.3, 1.18, -3.8);
scene.add(alarm);
const alarmScreen = new THREE.Mesh(
  new THREE.BoxGeometry(0.25, 0.15, 0.02),
  new THREE.MeshStandardMaterial({ color: 0x00ff88, emissive: 0x00ff88, emissiveIntensity: 1 })
);
alarmScreen.position.set(-1.3, 1.2, -3.72);
scene.add(alarmScreen);

// ---------- ПЛАКАТ / ДОСКА НА ЛЕВОЙ СТЕНЕ ----------
const board = new THREE.Mesh(new THREE.BoxGeometry(0.08, 2, 2.5), mat.woodLight);
board.position.set(-ROOM / 2 + 0.15, 3.2, 0);
wallLeft.add(board);
// Кнопки/стикеры
for (let i = 0; i < 8; i++) {
  const sticker = new THREE.Mesh(
    new THREE.BoxGeometry(0.02, 0.3 + Math.random() * 0.3, 0.3 + Math.random() * 0.3),
    new THREE.MeshStandardMaterial({
      color: new THREE.Color().setHSL(Math.random(), 0.7, 0.6)
    })
  );
  sticker.position.set(
    -ROOM / 2 + 0.2,
    2.5 + Math.random() * 1.5,
    -1 + Math.random() * 2
  );
  wallLeft.add(sticker);
}

// ---------- ПЕРЕГОРОДКА / ПОЛКА НА ПРАВОЙ СТЕНЕ ----------
const wallShelf = new THREE.Mesh(new THREE.BoxGeometry(0.08, 0.15, 2), mat.wood);
wallShelf.position.set(ROOM / 2 - 0.15, 3, 1);
wallRight.add(wallShelf);
// Фигурки на полке
for (let i = 0; i < 3; i++) {
  const fig = new THREE.Mesh(
    new THREE.ConeGeometry(0.15, 0.4, 8),
    new THREE.MeshStandardMaterial({ color: new THREE.Color().setHSL(Math.random(), 0.8, 0.5) })
  );
  fig.position.set(ROOM / 2 - 0.25, 3.3, 0.3 + i * 0.6);
  wallRight.add(fig);
}

// ---------- ЛЕТАЮЩИЕ ЧАСТИЦЫ (пыль) ----------
const dustGeo = new THREE.BufferGeometry();
const dustCount = 100;
const dustPos = new Float32Array(dustCount * 3);
for (let i = 0; i < dustCount; i++) {
  dustPos[i * 3] = (Math.random() - 0.5) * ROOM;
  dustPos[i * 3 + 1] = Math.random() * WALL_H;
  dustPos[i * 3 + 2] = (Math.random() - 0.5) * ROOM;
}
dustGeo.setAttribute('position', new THREE.BufferAttribute(dustPos, 3));
const dust = new THREE.Points(
  dustGeo,
  new THREE.PointsMaterial({ color: 0xffffee, size: 0.04, transparent: true, opacity: 0.5 })
);
scene.add(dust);

// ---------- ПЕРЕКЛЮЧАТЕЛЬ ВИДА ----------
const viewRadios = document.querySelectorAll('input[name="view"]');
function applyView(mode) {
  floorGroup.visible = true; // пол всегда виден по условию
  wallBack.visible = false;
  wallLeft.visible = false;
  wallRight.visible = false;
  wallFront.visible = false;
  if (mode === 'all') {
    wallBack.visible = true;
    wallLeft.visible = true;
    wallRight.visible = true;
    wallFront.visible = true;
  } else if (mode === 'back') {
    wallBack.visible = true;
  } else if (mode === 'floor') {
    // только пол — уже установлен
  }
}
viewRadios.forEach(r => r.addEventListener('change', e => applyView(e.target.value)));
applyView('all');

// ---------- РЕСАЙЗ ----------
window.addEventListener('resize', () => {
  const a = window.innerWidth / window.innerHeight;
  camera.left = -frustum * a;
  camera.right = frustum * a;
  camera.top = frustum;
  camera.bottom = -frustum;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

// ---------- АНИМАЦИЯ ----------
const clock = new THREE.Clock();
function animate() {
  requestAnimationFrame(animate);
  const t = clock.getElapsedTime();

  // Лёгкое покачивание пыли
  const pos = dust.geometry.attributes.position.array;
  for (let i = 0; i < dustCount; i++) {
    pos[i * 3 + 1] += Math.sin(t + i) * 0.001;
    if (pos[i * 3 + 1] > WALL_H) pos[i * 3 + 1] = 0;
  }
  dust.geometry.attributes.position.needsUpdate = true;

  // Мерцание экранов
  mat.screen.emissiveIntensity = 0.7 + Math.sin(t * 3) * 0.1;

  controls.update();
  renderer.render(scene, camera);
}
animate();
</script>
